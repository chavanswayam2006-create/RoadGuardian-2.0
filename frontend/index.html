<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RoadGuardian 2.0 | Precision AI Automotive Safety Platform</title>
    <meta name="description" content="Commercial-grade AI Traffic Sign Recognition & In-Cabin Driver Monitoring HMI Cockpit" />
    
    <!-- Google Fonts: Space Grotesk, Inter, JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    
    <!-- Leaflet Map CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    
    <!-- Tailwind CSS (Play CDN for rapid reactive utilities) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      if (typeof tailwind !== 'undefined') {
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              colors: {
                bg: "#030B14",
                surface: "#071522",
                "surface-secondary": "#0B1B2A",
                "surface-elevated": "#102335",
                "surface-highest": "#162B3E",
                "text-primary": "#E6F0FA",
                "text-secondary": "#9BAEC0",
                "text-muted": "#66798B",
                accent: "#8DB8FF",
                "accent-strong": "#4D8EFF",
                success: "#35D69A",
                warning: "#F5B942",
                critical: "#FF5C67",
                border: "rgba(150, 180, 210, 0.14)",
                "border-subtle": "rgba(150, 180, 210, 0.08)",
                "border-strong": "rgba(141, 184, 255, 0.32)",
              },
              fontFamily: {
                headline: ["Space Grotesk", "sans-serif"],
                body: ["Inter", "sans-serif"],
                mono: ["JetBrains Mono", "monospace"],
              },
              borderRadius: {
                xs: "4px",
                sm: "6px",
                md: "8px",
                lg: "10px",
                xl: "12px",
              }
            }
          }
        };
      }
    </script>
  </head>
  <body class="bg-bg font-body text-text-primary antialiased selection:bg-accent/20 selection:text-text-primary">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
